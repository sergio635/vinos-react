[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.netlify/functions/wine-detail/*"
  to = "/.netlify/functions/wine-detail/:splat"
  status = 200

  [dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false